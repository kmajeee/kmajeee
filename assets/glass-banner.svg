<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C54"/>
      <stop offset="45%" stop-color="#6A0572"/>
      <stop offset="100%" stop-color="#AB4B9C"/>
    </linearGradient>

    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="blurGlass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="320" fill="url(#bg)"/>

  <!-- floating blurred orbs (glass light sources) -->
  <circle cx="120" cy="60" r="90" fill="url(#orb1)" filter="url(#blurHeavy)">
    <animate attributeName="cy" values="60;40;60" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="780" cy="250" r="110" fill="url(#orb2)" filter="url(#blurHeavy)">
    <animate attributeName="cy" values="250;270;250" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="820" cy="60" r="70" fill="url(#orb3)" filter="url(#blurHeavy)">
    <animate attributeName="cx" values="820;790;820" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="80" cy="280" r="60" fill="url(#orb3)" filter="url(#blurHeavy)">
    <animate attributeName="opacity" values="0.5;0.85;0.5" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <!-- frosted glass panel -->
  <g filter="url(#softShadow)">
    <rect x="90" y="70" width="720" height="180" rx="28" fill="url(#glassFill)" filter="url(#blurGlass)"/>
    <rect x="90" y="70" width="720" height="180" rx="28" fill="none" stroke="url(#glassStroke)" stroke-width="1.5"/>
  </g>

  <!-- subtle top highlight sheen -->
  <path d="M 90 98 Q 450 70 810 98 L 810 110 Q 450 90 90 110 Z" fill="#FFFFFF" opacity="0.12"/>

  <!-- name -->
  <text x="450" y="150" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800"
        fill="#FFFFFF" text-anchor="middle" filter="url(#textGlow)">
    Sheik Abdul Majeeth K M
  </text>

  <!-- tagline -->
  <text x="450" y="188" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500"
        fill="#E9D5FF" text-anchor="middle" opacity="0.95">
    building apps that don't just work — they hit different
  </text>

  <!-- small pulsing accent dot -->
  <circle cx="450" cy="215" r="4" fill="#F472B6">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
